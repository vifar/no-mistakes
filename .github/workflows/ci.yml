name: CI

# Before registering a runner, enforce the repository-wide Actions actor
# policy documented in docs/src/content/docs/guides/fork-ci.md. The job guard
# alone cannot stop a fork from modifying another workflow's runs-on labels.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  # Keep non-PR groups unique: cancel-in-progress: false alone still allows
  # pending-run replacement. Policy: docs/src/content/docs/guides/fork-ci.md.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The ci-pilot runner host exposes 8 vCPU. Size the Go runtime to the
  # guest instead of pinning it below the machine, so the race suite and the
  # e2e journeys use the cores they are given.
  GOMAXPROCS: '8'

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, king-server, no-mistakes]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          # Persistent self-hosted runner: its Go module and build caches
          # already live on local disk. The action's post-job cache save can
          # hang until the job timeout (see guides/fork-ci.md).
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check generated skill and vet
        run: make lint

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, king-server, no-mistakes]
    # The race suite is split across parallel shards (scripts/race.sh), so
    # the job costs the time of its slowest shard rather than the sum of
    # every package's race time. Run as one process, the suite outgrew the
    # job's bound and was killed with internal/pipeline/steps and fifteen
    # more packages never started.
    #
    # The sharded makespan is about 27 minutes (one measured long pole per
    # shard, the rest of the packages spread over the shards), and the runner
    # is a shared VM whose other jobs add contention. The 90 minute wall
    # leaves room for that without hiding a hung test: a package that hangs
    # is killed by the suite's own per-package timeout and reported.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          # Persistent self-hosted runner: its Go module and build caches
          # already live on local disk. The action's post-job cache save can
          # hang until the job timeout (see guides/fork-ci.md).
          cache: false
      - name: Full Linux race suite
        # The suite is split across parallel shards (scripts/race.sh), so the
        # job costs the time of its slowest shard rather than the sum of
        # every package's race time. Run as one process, the suite outgrew
        # the job's bound and was killed with internal/pipeline/steps and
        # fifteen more packages never started.
        #
        # The per-package timeout is per test binary, so it must stay under
        # the job's 90 minute wall; the package suite needs well under it.
        run: bash scripts/race.sh
      - name: Build Linux CLI
        run: go build -o bin/no-mistakes ./cmd/no-mistakes
      - name: Cross-compile desktop CLI targets
        run: |
          set -eu
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o "$RUNNER_TEMP/no-mistakes-${target%/*}-${target#*/}" ./cmd/no-mistakes
          done

  e2e:
    # The race suite and the e2e journeys each saturate the same eight-vCPU
    # VM, and separate runner processes on that VM accept them concurrently:
    # in run 39963484774 the two jobs overlapped for 26 of the e2e job's 48
    # minutes. Sequence them, and keep the e2e job eligible when the race job
    # fails, because its result is evidence either way. The same-repository
    # guard is preserved inside the status-function wrapper, so external fork
    # code still never reaches the runner.
    needs: test
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, king-server, no-mistakes]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          # Persistent self-hosted runner: its Go module and build caches
          # already live on local disk. The action's post-job cache save can
          # hang until the job timeout (see guides/fork-ci.md).
          cache: false
      - name: End-to-end journeys with temporary daemon cleanup
        # scripts/e2e.sh spends a 60 minute internal budget across its
        # sequential phases, so the job wall must exceed it.
        run: make e2e
